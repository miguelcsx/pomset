packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # esbuild's install script links its platform binary; Vite and Vitest need it.
  esbuild: true
  # Prisma's install scripts fetch its query and schema engines. The hosted store
  # uses the `pg` driver adapter, so no query engine is ever loaded, and
  # migrations are reviewed SQL rather than `prisma migrate`. Generation alone
  # needs neither, so installs stay offline and need no binary.
  '@prisma/engines': false
  prisma: false

# One version per shared development dependency, declared here rather than
# repeated in nine manifests. A member references these with `catalog:`.
#
# React and its types are pinned here for a sharper reason: two copies of
# `@types/react` in one workspace make a package fail to compile with
# "cannot be named without a reference to ...@types/react", which is what
# happened when the client moved to React 19 and the shared UI package did not.
catalog:
  "@types/node": ^22.10.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  ajv: ^8.17.1
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ~5.7.2
  vitest: ^3.0.5

# The Nix development shell provides the pnpm that executes these scripts. No
# `packageManager` field is set on the root manifest on purpose: pnpm 10 and
# later re-execute themselves as whatever version that field declares, fetching
# it when it is not already present, which breaks the offline shell. See the
# comment in flake.nix.
