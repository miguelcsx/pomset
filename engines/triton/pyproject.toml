[project]
name = "pomset-triton"
version = "0.0.0"
description = "The Triton engine: parse the supported kernel subset as source text and answer the bounds, output-coverage and write/write-conflict queries symbolically. The symbolic path never imports or executes the user module."
requires-python = "==3.12.*"
dependencies = [
  # The SMT solver the symbolic queries are discharged with. Pinned; the probe
  # in feasibility/probe.py records the exact resolved version in the profile.
  "z3-solver==4.13.0.0",
  # Array handling for the recorded witness points and the numerical reference.
  "numpy==2.1.3",
  # RFC 8785 JSON canonicalisation, for the snapshot manifest hash. The
  # TypeScript side implements the same algorithm natively, because the RFC's
  # number formatting is exactly ECMAScript's; a shared fixture proves the two
  # agree rather than assuming it.
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
# The executable replay path. Triton ships wheels for Linux only, so this extra
# is installed where replay is actually possible; everywhere else the capability
# is recorded as unavailable rather than approximated. Nothing in the symbolic
# path depends on it.
replay = [
  "triton==3.1.0; sys_platform == 'linux'",
  "torch==2.5.1; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pomset_triton"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
