[project]
name = "pomset-openmp"
version = "0.0.0"
description = "The OpenMP engine: compile a host-parallel kernel with Clang and OpenMP, run it locally against its declared reference, and report what was observed — including the instrumentation that could not be run."
requires-python = "==3.12.*"
dependencies = [
  # The canonical schemas, the record validators, the engine line protocol and
  # the bounded tool helpers.
  "pomset-contracts",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
]

[tool.uv.sources]
pomset-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pomset_openmp"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
