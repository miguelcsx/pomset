$schema: https://json-schema.org/draft/2020-12/schema
$id: https://pomset.dev/contracts/evidence.schema.yaml
title: Pomset evidence contracts
description: Authoritative portable definitions for actors, memory-access events, source ranges, findings,
  witnesses, assumptions, coverage, budgets, sampled checks, property results and the error vocabulary.
  A finding links multiple actors, events and source ranges; no total order is invented between independent
  events.
$defs:
  schemaVersion:
    type: integer
    const: 1
  id:
    type: string
    minLength: 3
    maxLength: 128
    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
  sha256:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  path:
    type: string
    minLength: 1
    maxLength: 512
    pattern: ^(?!/)(?!.*\.\.)(?!.*\\)[A-Za-z0-9._@+-]+(/[A-Za-z0-9._@+-]+)*$
  propertyId:
    anyOf:
    - enum:
      - memoryBounds
      - outputCoverage
      - initialization
      - writeWriteConflict
      - readWriteConflict
      - raceFreedom
      - synchronizationOrdering
      - deadlockFreedom
      - numericalAgreement
      - performanceRegression
    - type: string
      pattern: ^x-[a-z0-9-]{2,64}$
  method:
    enum:
    - static
    - symbolic
    - instrumented
    - benchmark
    - artifact
  evidenceClass:
    description: What the user may conclude. Chosen independently of the outcome value.
    enum:
    - observed
    - counterexample
    - potential
    - verified-under-assumptions
    - measured
    - estimated
  outcome:
    description: Decision of one property check. established is only reachable through static/symbolic
      reasoning over a stated model and domain.
    enum:
    - established
    - violated
    - unknown
    - unsupported
  backendId:
    enum:
    - triton
    - cuda
    - openmp
  semanticRole:
    description: Presentation role. Decorates an independent state; never replaces it with one green safety
      label.
    enum:
    - violation
    - caution
    - activity
    - unknown
    - contract
  sourceRange:
    description: Half-open source range. backendFile is set when the range belongs to an IR or PTX artifact
      rather than the user's source text.
    type: object
    required:
    - path
    - startLine
    - startColumn
    - endLine
    - endColumn
    properties:
      path:
        $ref: '#/$defs/path'
      startLine:
        type: integer
        minimum: 1
      startColumn:
        type: integer
        minimum: 0
      endLine:
        type: integer
        minimum: 1
      endColumn:
        type: integer
        minimum: 0
      kind:
        enum:
        - source
        - ir
        - ptx
        - assembly
      confidence:
        description: 'sourceMap quality: exact, approximate or unavailable source mapping.'
        enum:
        - exact
        - approximate
        - unavailable
      artifactId:
        $ref: '#/$defs/id'
    additionalProperties: false
  actor:
    description: 'Execution agent or symbolic execution domain. A symbolic-domain actor has no invented concrete coordinates.'
    type: object
    required:
    - actorId
    - kind
    - label
    properties:
      actorId:
        $ref: '#/$defs/id'
      kind:
        enum:
        - symbolic-domain
        - cpu-thread
        - program-instance
        - block
        - warp
        - lane
        - task
        - task-group
        - device
      label:
        type: string
        maxLength: 200
      coordinates:
        description: Backend-specific index coordinates, e.g. program id, thread id, warp id.
        type: object
        additionalProperties:
          type: integer
      parentActorId:
        $ref: '#/$defs/id'
    additionalProperties: false
  memoryAccessEvent:
    description: One memory event attributed to an actor. addressExpr is symbolic and must not be evaluated
      into a fake concrete address.
    type: object
    required:
    - eventId
    - actorId
    - operation
    - scope
    - addressExpr
    properties:
      eventId:
        $ref: '#/$defs/id'
      actorId:
        $ref: '#/$defs/id'
      operation:
        enum:
        - read
        - write
        - atomic-read
        - atomic-write
        - atomic-read-modify-write
        - fence
        - barrier
        - task-create
        - task-join
        - wait
        - signal
      scope:
        enum:
        - lane
        - warp
        - block
        - grid
        - device
        - system
        - thread-group
        - runtime-specific
      scopeLabel:
        type: string
        maxLength: 120
      allocationId:
        $ref: '#/$defs/id'
      addressExpr:
        type: string
        minLength: 1
        maxLength: 4000
      addressConcrete:
        description: Present only when a witness fixes every domain variable. Never guessed.
        type: object
        required:
        - bytes
        properties:
          bytes:
            type: integer
            minimum: 0
          display:
            type: string
            maxLength: 120
        additionalProperties: false
      maskExpr:
        type: string
        maxLength: 4000
      enabled:
        description: True when the mask of this access can be satisfied under the declared domain.
        type: boolean
      sourceRanges:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/sourceRange'
      producedBy:
        $ref: '#/$defs/id'
    additionalProperties: false
  assumptions:
    description: Everything a reader must know for any established outcome to mean anything.
    type: object
    required:
    - model
    - domainRef
    - items
    properties:
      model:
        description: Named semantics used, e.g. a Triton sub-subset or a memory model identifier.
        type: string
        minLength: 1
        maxLength: 500
      modelRevision:
        type: string
        maxLength: 120
      domainRef:
        $ref: '#/$defs/id'
      items:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - assumptionId
          - statement
          properties:
            assumptionId:
              $ref: '#/$defs/id'
            statement:
              type: string
              minLength: 1
              maxLength: 2000
            kind:
              enum:
              - width
              - aliasing
              - initialization
              - launch
              - ordering
              - tool
              - environment
              - other
          additionalProperties: false
    additionalProperties: false
  budget:
    description: Resource envelope that bounds the analysis. Exhausting it yields unknown, never a failure
      of the property.
    type: object
    required:
    - solverTimeMs
    - engineWallTimeMs
    - memoryBytes
    - maxMessageBytes
    - maxOutputBytes
    - maxArtifactBytes
    properties:
      solverTimeMs:
        type: integer
        minimum: 0
      engineWallTimeMs:
        type: integer
        minimum: 0
      memoryBytes:
        type: integer
        minimum: 0
      maxMessageBytes:
        type: integer
        minimum: 0
      maxOutputBytes:
        type: integer
        minimum: 0
      maxArtifactBytes:
        type: integer
        minimum: 0
      usedSolverTimeMs:
        type: integer
        minimum: 0
      usedWallTimeMs:
        type: integer
        minimum: 0
      exhausted:
        description: True when a limit was hit. The associated property remains unknown.
        type: boolean
    additionalProperties: false
  witness:
    description: Concrete or model-level assignment that exhibits a violation. Minimized witnesses keep
      every necessary assumption.
    type: object
    required:
    - witnessId
    - kind
    - assignments
    - actorIds
    - eventIds
    - sourceRanges
    properties:
      witnessId:
        $ref: '#/$defs/id'
      kind:
        enum:
        - domain-point
        - concrete-address
        - schedule-interleaving
        - mask-region
        - output-index
        - minimized
      assignments:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - name
          - value
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 64
            value:
              type:
              - integer
              - string
          additionalProperties: false
      actorIds:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/id'
      eventIds:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/id'
      sourceRanges:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/sourceRange'
      addressExpr:
        type: string
        maxLength: 4000
      replay:
        description: Optional replay of the witness through an independent execution path. Absent means
          no replay was available.
        type: object
        required:
        - method
        - outcome
        properties:
          method:
            enum:
            - cpu-interpreter
            - native-run
            - instrumented-run
            - symbolic-replay
          outcome:
            enum:
            - reproduced
            - not-reproduced
            - blocked
          profileRevisionId:
            $ref: '#/$defs/id'
          artifactId:
            $ref: '#/$defs/id'
          note:
            type: string
            maxLength: 1000
        additionalProperties: false
      minimization:
        type: object
        required:
        - attempted
        - droppedAssumptions
        properties:
          attempted:
            type: boolean
          droppedAssumptions:
            type: integer
            minimum: 0
          note:
            type: string
            maxLength: 1000
        additionalProperties: false
    additionalProperties: false
  partialOrder:
    description: Causal partial order over events. Only edges the analysis actually established are listed.
    type: object
    required:
    - edgeIds
    - edges
    properties:
      edgeIds:
        type: array
        items:
          $ref: '#/$defs/id'
      edges:
        type: array
        items:
          type: object
          required:
          - fromEventId
          - toEventId
          - relation
          properties:
            fromEventId:
              $ref: '#/$defs/id'
            toEventId:
              $ref: '#/$defs/id'
            relation:
              enum:
              - program-order
              - synchronizes-with
              - happens-before
              - sequenced-before
              - unresolved
            synchronizationEventId:
              $ref: '#/$defs/id'
          additionalProperties: false
      isTotal:
        description: Always false for an order that leaves independent events unordered.
        type: boolean
    additionalProperties: false
  finding:
    description: One reportable issue. May link multiple actors, events and source ranges across several
      tools or sources.
    type: object
    required:
    - schemaVersion
    - findingId
    - propertyId
    - evidenceClass
    - title
    - actorIds
    - eventIds
    - sourceRanges
    properties:
      schemaVersion:
        $ref: '#/$defs/schemaVersion'
      findingId:
        $ref: '#/$defs/id'
      propertyId:
        $ref: '#/$defs/propertyId'
      evidenceClass:
        $ref: '#/$defs/evidenceClass'
      title:
        type: string
        minLength: 1
        maxLength: 200
      explanation:
        type: string
        maxLength: 8000
      actorIds:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/id'
      eventIds:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/id'
      sourceRanges:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/sourceRange'
      allocationIds:
        type: array
        items:
          $ref: '#/$defs/id'
      witnessId:
        $ref: '#/$defs/id'
      order:
        $ref: '#/$defs/partialOrder'
      provenance:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - sourceId
          - method
          - tool
          properties:
            sourceId:
              $ref: '#/$defs/id'
            method:
              $ref: '#/$defs/method'
            tool:
              type: string
              minLength: 1
              maxLength: 200
            toolVersion:
              type: string
              maxLength: 120
            artifactIds:
              type: array
              items:
                $ref: '#/$defs/id'
          additionalProperties: false
      semanticRole:
        $ref: '#/$defs/semanticRole'
      correctionHint:
        $ref: '#/$defs/correctionHint'
      backendId:
        $ref: '#/$defs/backendId'
    additionalProperties: false
  correctionHint:
    description: Qualified explanation of a recognized pattern. Not generic repair synthesis and never
      a proved functional repair.
    type: object
    required:
    - hintId
    - patternId
    - suggestion
    - qualified
    properties:
      hintId:
        $ref: '#/$defs/id'
      patternId:
        enum:
        - positive-n-positive-block-floor-grid
        - x-other
      suggestion:
        type: string
        minLength: 1
        maxLength: 1000
      requiresUserRerun:
        description: Always true. Pomset never rewrites the kernel automatically.
        type: boolean
      qualified:
        description: Always true. The hint is an explanation of a pattern, not a verified repair.
        type: boolean
      basisFindingId:
        $ref: '#/$defs/id'
    additionalProperties: false
  coverage:
    description: Per-property classification over the declared domain. Percentages only exist for a finite,
      explicitly enumerated denominator with duplicate points removed.
    type: object
    required:
    - coverageId
    - domainRef
    - regions
    - denominator
    properties:
      coverageId:
        $ref: '#/$defs/id'
      domainRef:
        $ref: '#/$defs/id'
      denominator:
        $ref: '#/$defs/coverageDenominator'
      regions:
        type: array
        items:
          type: object
          required:
          - regionId
          - constraints
          - classifications
          properties:
            regionId:
              $ref: '#/$defs/id'
            label:
              type: string
              maxLength: 200
            constraints:
              type: array
              minItems: 1
              items:
                type: string
                maxLength: 500
            classifications:
              type: array
              minItems: 1
              items:
                type: object
                required:
                - propertyId
                - classification
                - method
                properties:
                  propertyId:
                    $ref: '#/$defs/propertyId'
                  classification:
                    enum:
                    - established
                    - violated
                    - sampled
                    - unknown
                    - unsupported
                  method:
                    $ref: '#/$defs/method'
                  resultId:
                    $ref: '#/$defs/id'
                  sampledCheckId:
                    $ref: '#/$defs/id'
                allOf:
                - description: sampled and unknown/unsupported regions carry their sampled check or the
                    reason, not a bare verdict.
                  if:
                    properties:
                      classification:
                        const: sampled
                    required:
                    - classification
                  then:
                    required:
                    - sampledCheckId
                additionalProperties: false
          additionalProperties: false
      notes:
        type: string
        maxLength: 2000
    additionalProperties: false
  sampledCheck:
    description: Finite sampling run. Its observations never become a domain-wide established outcome.
    type: object
    required:
    - sampledCheckId
    - strategyId
    - strategyRevision
    - seed
    - budget
    - points
    - observations
    properties:
      sampledCheckId:
        $ref: '#/$defs/id'
      strategyId:
        enum:
        - exhaustive
        - random
        - boundary
        - counterexample-guided
        - partition-guided
      strategyRevision:
        type: integer
        minimum: 1
      seed:
        type: integer
        minimum: 0
      budget:
        $ref: '#/$defs/budget'
      points:
        type: array
        items:
          type: object
          required:
          - pointId
          - assignments
          properties:
            pointId:
              $ref: '#/$defs/id'
            assignments:
              type: array
              minItems: 1
              items:
                type: object
                required:
                - name
                - value
                properties:
                  name:
                    type: string
                  value:
                    type:
                    - integer
                    - string
                additionalProperties: false
          additionalProperties: false
      observations:
        type: array
        items:
          type: object
          required:
          - pointId
          - observation
          properties:
            pointId:
              $ref: '#/$defs/id'
            observation:
              enum:
              - passed
              - failed
              - error
            findingId:
              $ref: '#/$defs/id'
            errorCode:
              $ref: '#/$defs/errorCode'
          additionalProperties: false
    additionalProperties: false
  propertyResult:
    description: Outcome of one property over one domain, with its method and evidence class. The allowed
      (outcome, method, evidenceClass) combinations are fixed in contracts/README.md.
    type: object
    required:
    - propertyResultId
    - propertyId
    - outcome
    - method
    - evidenceClass
    - assumptions
    - coverageRef
    properties:
      propertyResultId:
        $ref: '#/$defs/id'
      propertyId:
        $ref: '#/$defs/propertyId'
      outcome:
        $ref: '#/$defs/outcome'
      method:
        $ref: '#/$defs/method'
      evidenceClass:
        $ref: '#/$defs/evidenceClass'
      assumptions:
        $ref: '#/$defs/assumptions'
      coverageRef:
        $ref: '#/$defs/id'
      budget:
        $ref: '#/$defs/budget'
      findingIds:
        type: array
        items:
          $ref: '#/$defs/id'
      witnessIds:
        type: array
        items:
          $ref: '#/$defs/id'
      sampledCheckIds:
        type: array
        items:
          $ref: '#/$defs/id'
      unsupportedReason:
        description: Required when outcome is unsupported. Names the capability and why it is unavailable.
        type: string
        maxLength: 2000
      unknownReason:
        description: Required when outcome is unknown, e.g. solver budget exhaustion or incomplete extraction.
        type: string
        maxLength: 2000
      semanticRole:
        $ref: '#/$defs/semanticRole'
    allOf:
    - description: established is reachable only through static or symbolic reasoning under stated assumptions.
      if:
        properties:
          outcome:
            const: established
        required:
        - outcome
      then:
        properties:
          method:
            enum:
            - static
            - symbolic
          evidenceClass:
            const: verified-under-assumptions
    - description: violated is either a modelled counterexample or a concretely observed dynamic violation.
      if:
        properties:
          outcome:
            const: violated
        required:
        - outcome
      then:
        properties:
          evidenceClass:
            enum:
            - counterexample
            - observed
    - description: unsupported names the missing capability.
      if:
        properties:
          outcome:
            const: unsupported
        required:
        - outcome
      then:
        required:
        - unsupportedReason
        properties:
          evidenceClass:
            enum:
            - potential
            - estimated
    - description: unknown names why the analysis was inconclusive.
      if:
        properties:
          outcome:
            const: unknown
        required:
        - outcome
      then:
        required:
        - unknownReason
    additionalProperties: false
  coverageDenominator:
    description: A percentage or count exists only for a finite, explicitly enumerated denominator with
      duplicates removed.
    type: object
    required:
    - kind
    properties:
      kind:
        enum:
        - enumerated
        - unenumerated
      pointCount:
        type: integer
        minimum: 0
      duplicatesRemoved:
        type: boolean
      constraintIds:
        type: array
        items:
          $ref: '#/$defs/id'
    allOf:
    - if:
        properties:
          kind:
            const: enumerated
        required:
        - kind
      then:
        required:
        - pointCount
        - duplicatesRemoved
        properties:
          duplicatesRemoved:
            const: true
    - if:
        properties:
          kind:
            const: unenumerated
        required:
        - kind
      then:
        not:
          required:
          - pointCount
    additionalProperties: false
  analysisResult:
    description: Immutable result record of one attempt. Carries full provenance; identifiers never substitute
      for it. A succeeded job may produce violated, unknown and unsupported property results.
    type: object
    required:
    - schemaVersion
    - resultId
    - jobId
    - attemptId
    - snapshotId
    - scenarioId
    - profileRevisionId
    - domain
    - policyId
    - policyRevision
    - origin
    - method
    - propertyResults
    - coverage
    - budget
    - createdAt
    properties:
      schemaVersion:
        $ref: '#/$defs/schemaVersion'
      resultId:
        $ref: '#/$defs/id'
      jobId:
        $ref: '#/$defs/id'
      attemptId:
        $ref: '#/$defs/id'
      snapshotId:
        $ref: '#/$defs/id'
      scenarioId:
        $ref: '#/$defs/id'
      profileRevisionId:
        $ref: '#/$defs/id'
      domain:
        type: object
        required:
        - domainId
        properties:
          domainId:
            $ref: '#/$defs/id'
        additionalProperties: true
      policyId:
        $ref: '#/$defs/id'
      policyRevision:
        type: integer
        minimum: 1
      origin:
        description: 'Ingestion trust: where this record entered Pomset. Execution location is carried
          separately.'
        enum:
        - local
        - hosted
        - imported
      executedAt:
        enum:
        - local
        - hosted
        - none
      method:
        $ref: '#/$defs/method'
      actors:
        type: array
        items:
          $ref: '#/$defs/actor'
      events:
        type: array
        items:
          $ref: '#/$defs/memoryAccessEvent'
      findings:
        type: array
        items:
          $ref: '#/$defs/finding'
      witnesses:
        type: array
        items:
          $ref: '#/$defs/witness'
      sampledChecks:
        type: array
        items:
          $ref: '#/$defs/sampledCheck'
      propertyResults:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/propertyResult'
      coverage:
        $ref: '#/$defs/coverage'
      budget:
        $ref: '#/$defs/budget'
      artifactManifestIds:
        type: array
        items:
          $ref: '#/$defs/id'
      queryRevision:
        description: Revision of the extraction and query model that produced this result.
        type: string
        maxLength: 120
      completeness:
        description: Supervisor-qualified completeness. Partial evidence never becomes an eligible completed validation.
        type: object
        required: [kind]
        properties:
          kind:
            enum: [complete, partial]
          reason:
            type: string
            minLength: 1
            maxLength: 1000
        additionalProperties: false
      createdAt:
        type: string
        format: date-time
    additionalProperties: false
  artifactManifest:
    description: Immutable description of one stored artifact. contentHash identifies bytes; artifactId
      is the authorization handle.
    type: object
    required:
    - schemaVersion
    - artifactId
    - kind
    - contentHash
    - bytes
    - createdAt
    properties:
      schemaVersion:
        $ref: '#/$defs/schemaVersion'
      artifactId:
        $ref: '#/$defs/id'
      kind:
        enum:
        - source-snapshot
        - ir
        - ptx
        - assembly
        - compiler-log
        - profiler-export
        - trace
        - witness-json
        - report-json
        - report-html
        - measurement-csv
        - bundle
      contentHash:
        $ref: '#/$defs/sha256'
      bytes:
        type: integer
        minimum: 0
      mediaType:
        type: string
        maxLength: 120
      producedBy:
        $ref: '#/$defs/id'
      profileRevisionId:
        $ref: '#/$defs/id'
      createdAt:
        type: string
        format: date-time
      retention:
        enum:
        - job
        - project
        - publication
        - permanent
      notes:
        type: string
        maxLength: 2000
    additionalProperties: false
  errorCode:
    description: Single error vocabulary shared by HTTP, engine envelopes, job failures and CLI reports.
    enum:
    - PROFILE_NOT_FOUND
    - ENGINE_FAILED
    - WORKER_LOST
    - PROTOCOL_INVALID
    - INPUT_INVALID
    - BUNDLE_INVALID
    - UNAUTHORIZED
    - FORBIDDEN
  errorRecord:
    type: object
    required:
    - code
    - message
    properties:
      code:
        $ref: '#/$defs/errorCode'
      message:
        type: string
        minLength: 1
        maxLength: 2000
      details:
        type: object
        additionalProperties: true
    additionalProperties: false
